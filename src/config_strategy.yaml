# 策略逻辑配置：谁启用、谁注释掉，以及各策略参数
# strategies: 列表里 enabled: true 的会被使用（取第一个）；enabled: false 即「注释掉」该策略
strategies:
  - id: event_driven
    enabled: true
    name: "事件驱动趋势跟踪"
  - id: rsi
    enabled: false
    name: "RSI 超买超卖"
  - id: hybrid
    enabled: false
    name: "混合新闻+价格"

# ---------- event_driven 策略参数 ----------
event_driven:
  strategy_name: "Event_Driven_Trend_Following"
  entry_rules:
    long_threshold: 0.6
    short_threshold: -0.6
    min_confidence: 0.8
  technical_filter:
    enable_ma_filter: true
    ma_period: 20
  position_sizing:
    risk_per_trade: 0.02
    max_leverage: 1
  risk_management:
    stop_loss_pct: 0.05
    take_profit_pct: 0.10

# ---------- rsi 策略参数 ----------
rsi:
  rsi_period: 14
  oversold: 30
  overbought: 70
  position_sizing:
    risk_per_trade: 0.02
    max_leverage: 1
  risk_management:
    stop_loss_pct: 0.05
    take_profit_pct: 0.10

# ---------- hybrid 策略参数 ----------
hybrid:
  sentiment_long_threshold: 0.5
  sentiment_short_threshold: -0.5
  min_confidence: 0.7
  position_sizing:
    risk_per_trade: 0.02
    max_leverage: 1
  risk_management:
    stop_loss_pct: 0.05
    take_profit_pct: 0.10

# 兼容旧版：顶层保留一份 event_driven 同构，供未读 event_driven 键的代码使用
strategy_name: "Event_Driven_Trend_Following"
entry_rules:
  long_threshold: 0.6
  short_threshold: -0.6
  min_confidence: 0.8
technical_filter:
  enable_ma_filter: true
  ma_period: 20
position_sizing:
  risk_per_trade: 0.02
  max_leverage: 1
risk_management:
  stop_loss_pct: 0.05
  take_profit_pct: 0.10
